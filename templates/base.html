<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --brand-blue: #0d6efd;
            --brand-navy: #123a6f;
            --page-bg: #eef6ff;
            --line-soft: #d8e8ff;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(13, 110, 253, 0.16), transparent 32rem),
                linear-gradient(180deg, #f7fbff 0%, var(--page-bg) 100%);
            color: #213547;
        }

        .navbar {
            box-shadow: 0 0.5rem 1.5rem rgba(13, 110, 253, 0.12);
        }

        .page-shell {
            width: min(1180px, calc(100% - 2rem));
            margin: 2rem auto;
        }

        .page-card {
            border: 1px solid var(--line-soft);
            border-radius: 0.5rem;
            box-shadow: 0 1rem 2.5rem rgba(18, 58, 111, 0.08);
        }

        .hero-panel {
            background: linear-gradient(135deg, #0d6efd 0%, #4dabf7 100%);
            border-radius: 0.5rem;
            color: #fff;
            padding: 1.75rem;
            box-shadow: 0 1rem 2.5rem rgba(13, 110, 253, 0.18);
        }

        .content-card {
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid var(--line-soft);
            border-radius: 0.5rem;
            box-shadow: 0 1rem 2.5rem rgba(18, 58, 111, 0.08);
        }

        .section-title {
            color: var(--brand-navy);
            font-weight: 700;
        }

        .section-subtitle {
            color: #5d7895;
        }

        .table thead th {
            background: #e7f1ff;
            color: var(--brand-navy);
            white-space: nowrap;
        }

        .form-label,
        .form-check-label {
            color: #284969;
            font-weight: 600;
        }

        .btn-soft-primary {
            background: #e7f1ff;
            border-color: #bfd9ff;
            color: var(--brand-navy);
        }

        .btn-soft-primary:hover {
            background: #d6e9ff;
            border-color: #98c5ff;
            color: #0b2f5f;
        }

        .data-label {
            color: #5d7895;
            font-size: 0.9rem;
            font-weight: 700;
        }
    </style>
    {% block title %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-primary navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'index' %}">學生資料管理系統</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="切換導覽列">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <div class="navbar-nav ms-auto gap-lg-2">
                    <a class="nav-link" href="{% url 'index' %}">首頁</a>
                    <a class="nav-link" href="{% url 'post' %}">新增資料</a>
                    <a class="nav-link" href="{% url 'search_name' %}">姓名搜尋</a>
                </div>
            </div>
        </div>
    </nav>
    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
